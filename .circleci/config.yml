version: 2.1

# CircleCI: build + unit-test a pull request ONLY when it targets `main`.
# Goal: know whether a PR still builds / produces an APK *before* it is merged.
# Nothing runs for ordinary branch pushes or for merges to `main`.
#
# Two layers are needed because CircleCI cannot filter on a PR's *target*
# branch in config:
#   1. The trigger (CircleCI UI) decides whether a pipeline is created at all.
#   2. The workflow ignores `main` so merging does not build, and the job's
#      first step is an authoritative gate that halts unless the build is a PR
#      whose base branch is `main`.
#
# One-time setup (CircleCI UI -> Project Settings):
#   * GitHub OAuth orgs: Project Setup/Advanced -> enable
#     "Only build pull requests". The default branch is still built by that
#     setting, which is why the workflow below ignores `main`.
#   * GitHub App orgs: Project Setup -> Triggers -> use a PR-only trigger, e.g.
#     "Pushes to open non-draft PRs" (add "Non-draft PR opened" as well). This
#     stops branch pushes from creating a pipeline.
#   * enable "Build forked pull requests" if PRs can come from forks.
# GitHub UI -> Settings -> Branches -> protect `main`:
#   * require the `build-apk` status check before merging.

executors:
  android:
    docker:
      - image: cimg/android:2026.08.1
    resource_class: small
    environment:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g"

jobs:
  build-apk:
    executor: android
    steps:
      - checkout

      - run:
          name: Gate - only build PRs targeting main
          command: |
            set -eu
            # Fail closed: anything that is not a pull request whose base branch
            # is exactly `main` halts. If the base branch cannot be determined
            # (API error/rate limit) we halt too, rather than build by default.
            # NB: `circleci-agent step halt` marks the step halted but does NOT
            # stop this shell, so every halt must be followed by `exit 0`
            # (otherwise `set -u` aborts on the unset variable and fails the job).
            if [ -z "${CIRCLE_PULL_REQUEST:-}" ]; then
              echo "Not a pull request - nothing to build."
              circleci-agent step halt
              exit 0
            fi
            PR="${CIRCLE_PULL_REQUEST##*/}"
            AUTH=()
            if [ -n "${GITHUB_TOKEN:-}" ]; then
              AUTH=(-H "Authorization: Bearer ${GITHUB_TOKEN}")
            fi
            BASE=$(curl -fsSL "${AUTH[@]}" \
              "https://api.github.com/repos/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}/pulls/${PR}" \
              2>/dev/null | python3 -c 'import json,sys; print(json.load(sys.stdin)["base"]["ref"])' 2>/dev/null \
              || echo unknown)
            echo "PR #${PR} targets '${BASE}'"
            if [ "${BASE}" != "main" ]; then
              echo "PR base is '${BASE}', not main - nothing to build."
              circleci-agent step halt
              exit 0
            fi

      - restore_cache:
          keys:
            - gradle-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}-{{ checksum "gradle/libs.versions.toml" }}
            - gradle-

      - run:
          name: Run unit tests + build debug APK
          command: ./gradlew --no-daemon assembleDebug testDebugUnitTest

      - save_cache:
          key: gradle-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}-{{ checksum "gradle/libs.versions.toml" }}
          paths:
            - ~/.gradle/caches
            - ~/.gradle/wrapper

      - store_test_results:
          path: app/build/test-results

      - run:
          name: Rename APK for download
          command: |
            V=$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | cut -d '"' -f2)
            SRC=$(ls app/build/outputs/apk/debug/*.apk | head -1)
            NAME="Messages-${V}-debug-$(date +%d-%m-%Y_%S-%M-%H).apk"
            cp "$SRC" "app/build/outputs/apk/debug/${NAME}"
            echo "Built ${NAME}"

      - store_artifacts:
          path: app/build/outputs/apk/debug
          destination: apk

workflows:
  build:
    jobs:
      - build-apk:
          filters:
            branches:
              ignore:
                - main

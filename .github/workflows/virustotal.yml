name: VirusTotal Scan

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to scan (default: latest)"
        required: false

permissions:
  contents: write

concurrency:
  group: virustotal-${{ github.event.inputs.tag || github.event.workflow_run.head_sha || 'manual' }}
  cancel-in-progress: false

env:
  VT_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}

jobs:
  scan:
    name: Scan release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve release
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then
            # sorted by creation order; avoids the eventually-consistent
            # "latest" view that returns "release not found" right after
            # softprops publishes a fresh release
            TAG=$(gh api "/repos/${GITHUB_REPOSITORY}/releases?per_page=1" --jq '.[0].tag_name')
          fi
          TAG=${TAG:-latest}
          ID=$(gh release view "$TAG" --json id --jq .id)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "Scanning release $TAG (id $ID)"

      - name: Check VirusTotal API key
        run: |
          if [ -z "$VT_API_KEY" ]; then
            echo "::error::Set the VIRUSTOTAL_API_KEY secret"
            exit 1
          fi

      - name: Download APK asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          mkdir -p /tmp/vt
          gh release download "$TAG" --pattern "Messages-*.apk" --dir /tmp/vt
          ls -lh /tmp/vt

      - name: Upload to VirusTotal
        id: upload
        run: |
          APK=$(ls /tmp/vt/Messages-*.apk | head -1)
          echo "Uploading $APK ($(stat -c%s "$APK") bytes)"
          RESP=$(curl -sf -H "x-apikey: $VT_API_KEY" -F "file=@$APK" \
            https://www.virustotal.com/api/v3/files)
          ID=$(echo "$RESP" | python3 -c "import sys,json;print(json.load(sys.stdin)['data']['id'])")
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          echo "analysis_id=$ID" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "Analysis id: $ID"

      - name: Wait for analysis and extract stats
        id: result
        run: |
          ANALY="${{ steps.upload.outputs.analysis_id }}"
          for i in $(seq 1 60); do
            if RESP=$(curl -sf -H "x-apikey: $VT_API_KEY" \
              "https://www.virustotal.com/api/v3/analyses/$ANALY"); then
              ST=$(echo "$RESP" | python3 -c \
                "import sys,json;print(json.load(sys.stdin)['data']['attributes']['status'])")
              if [ "$ST" = "completed" ]; then
                echo "$RESP" > /tmp/vt/result.json
                break
              fi
            fi
            sleep 15
          done
          test -f /tmp/vt/result.json || { echo "::error::Analysis did not finish in time"; exit 1; }
          python3 - "$GITHUB_OUTPUT" <<'PY'
          import json,sys
          d=json.load(open('/tmp/vt/result.json'))
          attr=d['data']['attributes']
          st=attr.get('stats',{})
          fi=d.get('meta',{}).get('file_info',{})
          total=sum(st.values())
          with open(sys.argv[1],'a') as f:
              for k in ('harmless','malicious','suspicious','undetected','timeout',
                        'confirmed-timeout','failure','type-unsupported'):
                  f.write(f"{k}={st.get(k,0)}\n")
              f.write(f"total={total}\n")
              f.write(f"sha256={fi.get('sha256','')}\n")
          print(f"engines={total} malicious={st.get('malicious',0)} suspicious={st.get('suspicious',0)}")
          PY

      - name: Post scan report to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.rel.outputs.tag }}
          SHA: ${{ steps.result.outputs.sha256 }}
          MAL: ${{ steps.result.outputs.malicious }}
          SUS: ${{ steps.result.outputs.suspicious }}
          GOOD: ${{ steps.result.outputs.harmless }}
          UNDET: ${{ steps.result.outputs.undetected }}
          TOTAL: ${{ steps.result.outputs.total }}
        run: |
          GUILINK="https://www.virustotal.com/gui/file/$SHA"
          # releases have no comments endpoint; append the report to the
          # release notes instead (matches softprops-generated notes)
          REPORT=$(cat <<EOF
          ## VirusTotal Scan Report

          Results for **\`Messages-$TAG.apk\`** - SHA-256: \`$SHA\`

          | Result | Count |
          |---|---|
          | Malicious | **$MAL** |
          | Suspicious | $SUS |
          | Harmless | $GOOD |
          | Undetected | $UNDET |
          | Total engines | $TOTAL |

          [View the full report on VirusTotal]($GUILINK)
          EOF
          )
          # The release notes can be rewritten by the release pipeline a short
          # while after publishing (eventual consistency), which would clobber
          # an append done once. Re-check and re-append for a few minutes so the
          # report is present at the end regardless of when the last write lands.
          for i in $(seq 1 12); do
            BODY=$(gh release view "$TAG" --json body --jq .body)
            if printf '%s' "$BODY" | grep -qF "## VirusTotal Scan Report"; then
              echo "VirusTotal report present (check $i)"
            else
              printf '%s\n\n%s\n' "$BODY" "$REPORT" > /tmp/vt/notes.md
              gh release edit "$TAG" --notes-file /tmp/vt/notes.md
              echo "Appended VirusTotal report (attempt $i)"
            fi
            sleep 30
          done
          {
            echo "## VirusTotal Scan Report"
            echo ""
            echo "Results for **Messages-$TAG.apk** - [full report]($GUILINK)"
            echo ""
            echo "| Result | Count |"
            echo "|---|---|"
            echo "| Malicious | **$MAL** |"
            echo "| Suspicious | $SUS |"
            echo "| Harmless | $GOOD |"
            echo "| Undetected | $UNDET |"
            echo "| Total engines | $TOTAL |"
          } >> "$GITHUB_STEP_SUMMARY"

      # Separate checkout for the badge commit: the scan checkout deliberately
      # uses persist-credentials: false, and this one needs to push to the
      # default branch.
      - name: Checkout default branch for badge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Publish badge state
        env:
          MAL: ${{ steps.result.outputs.malicious }}
          SUS: ${{ steps.result.outputs.suspicious }}
          TOTAL: ${{ steps.result.outputs.total }}
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          # shields.io serves the README badge out of this file, so it has to
          # exist on the default branch. Never fail the job on a badge push —
          # the scan itself is the thing that matters.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 - "$MAL" "$SUS" "$TOTAL" > .github/virustotal.json <<'PY'
          import json, sys
          mal, sus, total = (int(x or 0) for x in sys.argv[1:4])
          flagged = mal + sus
          color = "brightgreen" if flagged == 0 else "yellow" if flagged <= 2 else "red"
          json.dump({
              "schemaVersion": 1,
              "label": "VirusTotal",
              "message": f"{flagged}/{total} flagged",
              "color": color,
          }, sys.stdout, indent=2)
          print()
          PY
          cat .github/virustotal.json
          if git diff --quiet -- .github/virustotal.json; then
            echo "Badge unchanged, nothing to commit"
          else
            git add .github/virustotal.json
            git commit -m "chore: update VirusTotal badge for v$TAG"
            git push origin "HEAD:$DEFAULT_BRANCH" \
              || echo "::warning::Could not push badge; README badge will lag"
          fi

      - name: Flag malware detections
        if: steps.result.outputs.malicious != '' && steps.result.outputs.malicious != '0'
        run: |
          echo "::error::VirusTotal reported ${{ steps.result.outputs.malicious }} malicious detection(s) for this APK - investigate before distributing"
          exit 1
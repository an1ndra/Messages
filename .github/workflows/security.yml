name: Security Scan

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    tags:
      - "v*"
      - "!v*-rc*"
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 4 * * 1"

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (Kotlin/Java)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - uses: gradle/actions/setup-gradle@67621b124fd2e251c5e8a0e6e3b91318f2287669 # v6.3.0

      # CodeQL's Kotlin extractor lags new Kotlin releases; raise its version cap
      - name: Raise CodeQL Kotlin version cap
        run: |
          kv=$(grep -E '^kotlin[[:space:]]*=' gradle/libs.versions.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          limit=$(echo "$kv" | awk -F. -v OFS=. '{ $3 = $3 + 1; print }')
          echo "CODEQL_EXTRACTOR_KOTLIN_OVERRIDE_MAXIMUM_VERSION_LIMIT=$limit" >> "$GITHUB_ENV"

      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: java-kotlin
          queries: security-and-quality
          build-mode: manual

      # --no-build-cache forces kotlinc to run under the CodeQL build tracer
      - name: Build for CodeQL
        run: ./gradlew --no-daemon assembleDebug --no-build-cache
        env:
          LC_ALL: C
          TZ: UTC

      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "/language:java-kotlin"

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Semgrep
        run: |
          python3 -m pip install --quiet --user semgrep
          export PATH="$HOME/.local/bin:$PATH"
          semgrep scan \
            --config p/security-audit \
            --config p/secrets \
            --sarif \
            --output "$GITHUB_WORKSPACE/semgrep.sarif"

      - uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  trivy:
    name: Trivy
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH,MEDIUM
          skip-dirs: build, .gradle, .git, app/build

      - uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: trivy-results.sarif
          category: trivy

  mobsf:
    name: MobSF (APK)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # heavy container run: release tags, manual, and weekly schedule only
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - uses: gradle/actions/setup-gradle@67621b124fd2e251c5e8a0e6e3b91318f2287669 # v6.3.0

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
        env:
          LC_ALL: C
          TZ: UTC

      - name: Start MobSF
        run: |
          docker run -d --name mobsf -p 8000:8000 ghcr.io/mobsf/mobsf:latest
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8000/api_docs >/dev/null 2>&1 && break
            sleep 5
          done

      - name: Run MobSF scan
        env:
          MOBSF_API_KEY: ci-scan
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          hash=$(curl -s -F "file=@$apk" -H "Authorization: ci-scan" \
            http://127.0.0.1:8000/api/v1/upload | python3 -c "import sys,json;print(json.load(sys.stdin)['hash'])")
          curl -s -X POST http://127.0.0.1:8000/api/v1/scan \
            --data "scan_type=apk&file_name=app-debug.apk&hash=$hash" -H "Authorization: ci-scan"
          for i in $(seq 1 120); do
            logs=$(curl -s -X POST http://127.0.0.1:8000/api/v1/scan_logs \
              --data "hash=$hash" -H "Authorization: ci-scan")
            echo "$logs" | grep -q "Scan Complete" && break
            sleep 5
          done
          curl -s -X POST http://127.0.0.1:8000/api/v1/scorecard \
            --data "hash=$hash" -H "Authorization: ci-scan" > "$GITHUB_WORKSPACE/mobsf-score.json"
          curl -s -X POST http://127.0.0.1:8000/api/v1/report_json \
            --data "hash=$hash" -H "Authorization: ci-scan" > "$GITHUB_WORKSPACE/mobsf-report.json"
          python3 -c "import json;d=json.load(open('$GITHUB_WORKSPACE/mobsf-report.json'));print('security_score:', d.get('security_score', '?'))"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mobsf-report
          path: |
            mobsf-report.json
            mobsf-score.json
          if-no-files-found: warn
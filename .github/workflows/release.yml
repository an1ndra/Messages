name: Release

on:
  push:
    tags:
      - "v*"
      - "!v*-rc*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build & publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Gradle wrapper & set up Gradle
        uses: gradle/actions/setup-gradle@67621b124fd2e251c5e8a0e6e3b91318f2287669 # v6.3.0
        with:
          validate-wrappers: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Restore keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::KEYSTORE_PASSWORD and KEY_PASSWORD secrets must be set together with the keystore"
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > release.keystore

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          LC_ALL: C
          TZ: UTC
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: |
          src=$(ls app/build/outputs/apk/release/*.apk | head -1)
          cp "$src" "Messages-${GITHUB_REF_NAME}.apk"

      - name: Verify APK signature
        run: |
          BT="$(ls -d "${ANDROID_HOME}"/build-tools/*/ | sort -V | tail -1)"
          expected="cf860ec345a6810230629e24a66adaa58c311ef2dae2d77da02b85d4022bf608"
          got="$("$BT/apksigner" verify --print-certs "Messages-${GITHUB_REF_NAME}.apk" \
            | grep 'SHA-256 digest' | head -1 | sed 's/.*digest: *//' | tr -d ' :' | tr 'A-F' 'a-f')"
          echo "Signing certificate SHA-256: $got"
          if [ -z "$got" ]; then
            echo "::error::APK has no verifiable signature (unsigned?)"
            exit 1
          fi
          if [ "$got" != "$expected" ]; then
            echo "::error::APK signed with unexpected certificate (expected $expected)"
            exit 1
          fi

      - name: Record toolchain info
        run: |
          gradle_ver="$(sed -n 's|.*/gradle-\([0-9][^/]*\)-bin.zip|\1|p' gradle/wrapper/gradle-wrapper.properties)"
          {
            echo "### Toolchain used for this build"
            echo ""
            echo "- Java: \`$(java -version 2>&1 | head -1)\`"
            echo "- Gradle: \`$gradle_ver\`"
            echo "- Runner: \`${{ runner.os }} (${{ runner.arch }})\`"
            echo "- Locale: \`LC_ALL=C TZ=UTC\`"
            echo "- APK SHA-256: \`$(sha256sum "Messages-${GITHUB_REF_NAME}.apk" | cut -d' ' -f1)\`"
          } > release-notes.md

      - name: Remove keystore
        if: always()
        run: rm -f release.keystore

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@fe965f7af51af5f2602596916f38a38df2e33de0 # v3.0.2
        with:
          generate_release_notes: true
          body_path: release-notes.md
          files: Messages-*.apk

  sync-fdroiddata:
    name: Update fdroiddata MR
    needs: build-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read released version
        id: ver
        run: |
          NAME=$(sed -n 's/.*versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          CODE=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts | head -1)
          echo "Released $NAME ($CODE) @ $(git rev-parse HEAD)"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Push metadata update to an1ndra/fdroiddata
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          NAME: ${{ steps.ver.outputs.name }}
          CODE: ${{ steps.ver.outputs.code }}
          COMMIT: ${{ github.sha }}
        run: |
          if [ -z "$GITLAB_TOKEN" ]; then
            echo "::error::Set the GITLAB_TOKEN secret (GitLab PAT with write_repository scope)"
            exit 1
          fi
          MET=metadata/com.anindra.messages.yml
          git clone --depth 1 -b com.anindra.messages \
            "https://oauth2:${GITLAB_TOKEN}@gitlab.com/an1ndra/fdroiddata.git" fdd
          cd fdd
          sed -i "s/versionName: .*/versionName: $NAME/"          "$MET"
          sed -i "s/^\( *\)versionCode: .*/\1versionCode: $CODE/" "$MET"
          sed -i "s/commit: [0-9a-f]\{40\}/commit: $COMMIT/"      "$MET"
          sed -i "s/^CurrentVersion: .*/CurrentVersion: $NAME/"   "$MET"
          sed -i "s/^CurrentVersionCode: .*/CurrentVersionCode: $CODE/" "$MET"
          git config user.name "anindra"
          git config user.email "anindrakarmakar+git@proton.me"
          git add "$MET"
          if git diff --cached --quiet; then
            echo "::notice::fdroiddata already at $NAME ($CODE) - nothing to push"
            exit 0
          fi
          git commit -m "Update to $NAME ($CODE)"
          git push
          echo "::notice::fdroiddata MR updated: https://gitlab.com/fdroid/fdroiddata/-/merge_requests/46632"

version: 2.1

# CircleCI: build the Android app whenever a pull request targets `main`
# (and on pushes to main), so a broken merge is caught before it lands.
# The debug APK is stored as a job artifact you can download and install.
#
# One-time project setup (CircleCI UI -> Project Settings -> Advanced):
#   * enable "Build forked pull requests" if you also want PRs from forks built.
# The job also halts itself for PRs that do not target main, so no extra
# branch filters are needed.

executors:
  android:
    docker:
      - image: cimg/android:2026.08.1
    resource_class: large
    environment:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g"

jobs:
  build-apk:
    executor: android
    steps:
      - checkout

      - run:
          name: Gate - only PRs targeting main (and pushes to main)
          command: |
            set -eu
            if [ -z "${CIRCLE_PULL_REQUEST:-}" ]; then
              if [ "${CIRCLE_BRANCH:-}" = "main" ]; then
                echo "Push to main - building."
                exit 0
              fi
              echo "Not a pull request and not main - nothing to build."
              circleci-agent step halt
            fi
            PR="${CIRCLE_PULL_REQUEST##*/}"
            BASE=$(curl -fsSL \
              "https://api.github.com/repos/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}/pulls/${PR}" \
              2>/dev/null | python3 -c 'import json,sys; print(json.load(sys.stdin)["base"]["ref"])' 2>/dev/null \
              || echo unknown)
            echo "PR #${PR} targets '${BASE}'"
            if [ "${BASE}" != "main" ] && [ "${BASE}" != "unknown" ]; then
              echo "PR does not target main - nothing to build."
              circleci-agent step halt
            fi

      - restore_cache:
          keys:
            - gradle-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}-{{ checksum "gradle/libs.versions.toml" }}
            - gradle-

      - run:
          name: Build debug APK + run unit tests
          command: ./gradlew --no-daemon assembleDebug testDebugUnitTest

      - save_cache:
          key: gradle-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}-{{ checksum "gradle/libs.versions.toml" }}
          paths:
            - ~/.gradle/caches
            - ~/.gradle/wrapper

      - store_test_results:
          path: app/build/test-results

      - run:
          name: Rename APK for download
          command: |
            V=$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | cut -d '"' -f2)
            SRC=$(ls app/build/outputs/apk/debug/*.apk | head -1)
            NAME="Messages-${V}-debug-${CIRCLE_SHA1:0:7}.apk"
            cp "$SRC" "app/build/outputs/apk/debug/${NAME}"
            echo "Built ${NAME}"

      - store_artifacts:
          path: app/build/outputs/apk/debug
          destination: apk

      - store_artifacts:
          path: app/build/reports/tests
          destination: unit-test-report

workflows:
  build:
    jobs:
      - build-apk

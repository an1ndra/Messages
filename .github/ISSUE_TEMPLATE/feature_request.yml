name: Feature request
description: Suggest an idea or improvement for Messages
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Is your feature related to a problem?
      description: A clear description of the problem, e.g. "I'm always frustrated when [...]".
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: What should happen instead.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative solutions or features you've considered.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: |
        Screenshots, references (e.g. how Google Messages does it), or anything else.
        For device-specific behavior, a report from **Settings → Advanced → Diagnostics**
        (`Downloads/Messages/messages-diagnostics.txt`) helps.
    validations:
      required: false

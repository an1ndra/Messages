name: Develop Build (manual)

# Manual, develop-only build for testing. Produces a downloadable APK artifact
# and never publishes a release, tag, or F-Droid update.
#
# Run it from: Actions -> "Develop Build (manual)" -> Run workflow -> pick the
# Develop branch. The APK appears under the run's "Artifacts" section.
#
# Note: GitHub only lists a workflow_dispatch workflow in the Actions UI once
# this file exists on the repository's default branch (main).

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: develop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build develop APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Verify the branch is Develop
        run: |
          branch="${GITHUB_REF_NAME}"
          case "$branch" in
            Develop|develop) echo "Building '$branch' at ${{ github.sha }}" ;;
            *)
              echo "::error::This workflow builds the Develop branch only (got '$branch')."
              exit 1
              ;;
          esac

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Gradle wrapper & set up Gradle
        uses: gradle/actions/setup-gradle@67621b124fd2e251c5e8a0e6e3b91318f2287669 # v6.3.0
        with:
          validate-wrappers: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Read versionName
        id: ver
        run: |
          V=$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | cut -d '"' -f2)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Building $V from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}"

      # Signing is optional: with keystore secrets the APK is release-signed
      # (installs as an update over a released build); otherwise a debug APK is
      # produced, which is always installable but has a different signature.
      - name: Restore keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > release.keystore
          else
            echo "::notice::RELEASE_KEYSTORE_BASE64 not set - building debug APK"
          fi

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f release.keystore ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            ./gradlew --no-daemon assembleRelease
          else
            ./gradlew --no-daemon assembleDebug
          fi

      - name: Collect APK
        id: apk
        run: |
          src=$(ls app/build/outputs/apk/release/*.apk 2>/dev/null | head -1)
          kind=release
          if [ -z "$src" ]; then
            src=$(ls app/build/outputs/apk/debug/*.apk | head -1)
            kind=debug
          fi
          name="Messages-${{ steps.ver.outputs.version }}-${kind}-${GITHUB_REF_NAME}-${GITHUB_SHA::7}.apk"
          cp "$src" "$name"
          sha=$(sha256sum "$name" | cut -d' ' -f1)
          echo "file=$name" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          {
            echo "### Develop test build"
            echo ""
            echo "- Version: \`${{ steps.ver.outputs.version }}\` ($kind)"
            echo "- Branch: \`${GITHUB_REF_NAME}\` @ \`${GITHUB_SHA::7}\`"
            echo "- APK: \`$name\`"
            echo "- SHA-256: \`$sha\`"
            echo ""
            echo "No release or tag was published. Download it from the Artifacts section below."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.apk.outputs.file }}
          path: ${{ steps.apk.outputs.file }}
          if-no-files-found: error
          retention-days: 30

      - name: Remove keystore
        if: always()
        run: rm -f release.keystore

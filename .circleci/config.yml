version: 2.1

# CircleCI: run unit tests on every PR that targets `main` as a merge gate.
# Minimal footprint: smallest resource class.
# The job halts early for non-main PRs and non-PR pushes.
#
# One-time project setup:
#   CircleCI UI -> Project Settings -> Advanced:
#     * enable "Build forked pull requests" for PRs from forks.
#   GitHub UI -> Settings -> Branches -> Branch protection rules for `main`:
#     * enable "Require status checks to pass before merging"
#     * add `build-apk` as a required check

executors:
  android:
    docker:
      - image: cimg/android:2026.08.1
    resource_class: small
    environment:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g"

jobs:
  build-apk:
    executor: android
    steps:
      - checkout

      - run:
          name: Gate - only build PRs targeting main
          command: |
            set -eu
            if [ -z "${CIRCLE_PULL_REQUEST:-}" ]; then
              echo "Not a pull request - nothing to build."
              circleci-agent step halt
            fi
            PR="${CIRCLE_PULL_REQUEST##*/}"
            BASE=$(curl -fsSL \
              "https://api.github.com/repos/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}/pulls/${PR}" \
              2>/dev/null | python3 -c 'import json,sys; print(json.load(sys.stdin)["base"]["ref"])' 2>/dev/null \
              || echo unknown)
            echo "PR #${PR} targets '${BASE}'"
            if [ "${BASE}" != "main" ] && [ "${BASE}" != "unknown" ]; then
              echo "PR does not target main - nothing to build."
              circleci-agent step halt
            fi

      - restore_cache:
          keys:
            - gradle-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}-{{ checksum "gradle/libs.versions.toml" }}
            - gradle-

      - run:
          name: Run unit tests + build debug APK
          command: ./gradlew --no-daemon assembleDebug testDebugUnitTest

      - save_cache:
          key: gradle-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}-{{ checksum "gradle/libs.versions.toml" }}
          paths:
            - ~/.gradle/caches
            - ~/.gradle/wrapper

      - store_test_results:
          path: app/build/test-results

      - run:
          name: Rename APK for download
          command: |
            V=$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | cut -d '"' -f2)
            SRC=$(ls app/build/outputs/apk/debug/*.apk | head -1)
            NAME="Messages-${V}-debug-$(date +%d-%m-%Y_%S-%M-%H).apk"
            cp "$SRC" "app/build/outputs/apk/debug/${NAME}"
            echo "Built ${NAME}"

      - store_artifacts:
          path: app/build/outputs/apk/debug
          destination: apk

workflows:
  build:
    jobs:
      - build-apk

name: PR Build

# Replaces the CircleCI PR job, which was removed. GitHub-hosted runners have
# 7 GB of RAM against CircleCI's 2 GB "small" class, which is what the old job
# was OOM-killed on ("Gradle build daemon disappeared unexpectedly").
#
# Runs for pull requests targeting main or Develop: Develop is the default
# branch, so feature work lands there first and only reaches main through a
# release pull request.

on:
  pull_request:
    branches: [main, Develop]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Build + unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-

      # A cold Gradle cache has to fetch every plugin from Maven Central and the
      # Plugin Portal, and a single 404 there fails the build before a line of
      # Kotlin compiles. Two pull requests died that way on artifacts that
      # resolve fine from everywhere else, so the resolve is retried rather than
      # leaving a red X for the author to re-run: the second attempt re-reads the
      # metadata, and the third starts from an empty module cache.
      - name: Build debug APK and run unit tests
        run: |
          for attempt in 1 2 3; do
            if ./gradlew --no-daemon assembleDebug testDebugUnitTest; then
              exit 0
            fi
            echo "::warning::Gradle attempt ${attempt} failed; retrying"
            rm -rf "${HOME}/.gradle/caches/modules-2"
            sleep $((attempt * 10))
          done
          echo "::error::Gradle failed after 3 attempts"
          exit 1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-test-results
          path: app/build/test-results/testDebugUnitTest
          if-no-files-found: ignore

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

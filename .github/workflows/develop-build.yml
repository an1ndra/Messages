name: Develop Build (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: develop-build-${{ github.ref }}
  cancel-in-progress: true

env:
  VT_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}

jobs:
  build:
    name: Build test APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Gradle wrapper & set up Gradle
        uses: gradle/actions/setup-gradle@67621b124fd2e251c5e8a0e6e3b91318f2287669 # v6.3.0
        with:
          validate-wrappers: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          # The action's default is "tools platform-tools", but Google removed
          # the deprecated `tools` package (setup-android issue #537), which made
          # `sdkmanager tools` fail. platform-tools is all we need.
          packages: 'platform-tools'

      - name: Read versionName
        id: ver
        run: |
          V=$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | cut -d '"' -f2)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Building $V from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}"

      # Signing is optional: with keystore secrets the APK is release-signed
      # (installs as an update over a released build); otherwise a debug APK is
      # produced, which is always installable but has a different signature.
      - name: Restore keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > release.keystore
          else
            echo "::notice::RELEASE_KEYSTORE_BASE64 not set - building debug APK"
          fi

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f release.keystore ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            ./gradlew --no-daemon assembleRelease
          else
            ./gradlew --no-daemon assembleDebug
          fi

      - name: Collect APK
        id: apk
        run: |
          src=$(ls app/build/outputs/apk/release/*.apk 2>/dev/null | head -1)
          kind=release
          if [ -z "$src" ]; then
            src=$(ls app/build/outputs/apk/debug/*.apk | head -1)
            kind=debug
          fi
          refsafe=$(echo "${GITHUB_REF_NAME}" | tr '/' '_')
          name="Messages-${{ steps.ver.outputs.version }}-${kind}-${refsafe}-${GITHUB_SHA::7}.apk"
          cp "$src" "$name"
          sha=$(sha256sum "$name" | cut -d' ' -f1)
          echo "file=$name" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          {
            echo "### Test build"
            echo ""
            echo "- Version: \`${{ steps.ver.outputs.version }}\` ($kind)"
            echo "- Branch: \`${GITHUB_REF_NAME}\` @ \`${GITHUB_SHA::7}\`"
            echo "- APK: \`$name\`"
            echo "- SHA-256: \`$sha\`"
            echo ""
            echo "No release or tag was published. Download it from the Artifacts section below."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.apk.outputs.file }}
          path: ${{ steps.apk.outputs.file }}
          if-no-files-found: error
          retention-days: 30

      - name: Check VirusTotal API key
        run: |
          if [ -z "$VT_API_KEY" ]; then
            echo "::notice::VIRUSTOTAL_API_KEY not set - skipping VirusTotal scan"
          fi

      - name: Upload to VirusTotal
        if: env.VT_API_KEY != ''
        id: upload
        run: |
          APK="${{ steps.apk.outputs.file }}"
          echo "Uploading $APK ($(stat -c%s "$APK") bytes)"
          RESP=$(curl -sf -H "x-apikey: $VT_API_KEY" -F "file=@$APK" \
            https://www.virustotal.com/api/v3/files)
          ID=$(echo "$RESP" | python3 -c "import sys,json;print(json.load(sys.stdin)['data']['id'])")
          echo "analysis_id=$ID" >> "$GITHUB_OUTPUT"
          echo "Analysis id: $ID"

      - name: Wait for analysis and extract stats
        if: env.VT_API_KEY != ''
        id: result
        run: |
          ANALY="${{ steps.upload.outputs.analysis_id }}"
          mkdir -p /tmp/vt
          for i in $(seq 1 60); do
            if RESP=$(curl -sf -H "x-apikey: $VT_API_KEY" \
              "https://www.virustotal.com/api/v3/analyses/$ANALY"); then
              ST=$(echo "$RESP" | python3 -c \
                "import sys,json;print(json.load(sys.stdin)['data']['attributes']['status'])")
              if [ "$ST" = "completed" ]; then
                echo "$RESP" > /tmp/vt/result.json
                break
              fi
            fi
            sleep 15
          done
          test -f /tmp/vt/result.json || { echo "::error::Analysis did not finish in time"; exit 1; }
          python3 - "$GITHUB_OUTPUT" <<'PY'
          import json,sys
          d=json.load(open('/tmp/vt/result.json'))
          attr=d['data']['attributes']
          st=attr.get('stats',{})
          fi=d.get('meta',{}).get('file_info',{})
          total=sum(st.values())
          with open(sys.argv[1],'a') as f:
              for k in ('harmless','malicious','suspicious','undetected','timeout',
                        'confirmed-timeout','failure','type-unsupported'):
                  f.write(f"{k}={st.get(k,0)}\n")
              f.write(f"total={total}\n")
              f.write(f"sha256={fi.get('sha256','')}\n")
          print(f"engines={total} malicious={st.get('malicious',0)} suspicious={st.get('suspicious',0)}")
          PY

      - name: Add VirusTotal report to job summary
        if: env.VT_API_KEY != ''
        env:
          FILE: ${{ steps.apk.outputs.file }}
          SHA: ${{ steps.result.outputs.sha256 }}
          MAL: ${{ steps.result.outputs.malicious }}
          SUS: ${{ steps.result.outputs.suspicious }}
          GOOD: ${{ steps.result.outputs.harmless }}
          UNDET: ${{ steps.result.outputs.undetected }}
          TOTAL: ${{ steps.result.outputs.total }}
        run: |
          GUILINK="https://www.virustotal.com/gui/file/$SHA"
          {
            echo "### VirusTotal Scan Report"
            echo ""
            echo "Results for **$FILE** - [full report]($GUILINK)"
            echo ""
            echo "| Result | Count |"
            echo "|---|---|"
            echo "| Malicious | **$MAL** |"
            echo "| Suspicious | $SUS |"
            echo "| Harmless | $GOOD |"
            echo "| Undetected | $UNDET |"
            echo "| Total engines | $TOTAL |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Flag malware detections
        if: env.VT_API_KEY != '' && steps.result.outputs.malicious != '' && steps.result.outputs.malicious != '0'
        run: |
          echo "::error::VirusTotal reported ${{ steps.result.outputs.malicious }} malicious detection(s) for this APK - investigate before sharing"
          exit 1

      - name: Remove keystore
        if: always()
        run: rm -f release.keystore

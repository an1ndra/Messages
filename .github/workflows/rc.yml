name: RC Build

# Quick bug-fix release from Develop: build the APK, scan it with
# VirusTotal, then publish the APK + scan report as a GitHub pre-release.
#
# Start it from Actions -> "RC Build" -> Run workflow (branch: develop),
# or push a `v*-rc*` tag. It is intentionally NOT wired to every develop
# push, since each run consumes VirusTotal quota.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*-rc*"

permissions:
  contents: write

concurrency:
  group: rc-${{ github.ref }}
  cancel-in-progress: false

env:
  VT_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}

jobs:
  build-rc:
    name: Build RC and scan with VirusTotal
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Gradle wrapper & set up Gradle
        uses: gradle/actions/setup-gradle@67621b124fd2e251c5e8a0e6e3b91318f2287669 # v6.3.0
        with:
          validate-wrappers: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: 'platform-tools'

      - name: Read versionName
        id: ver
        run: |
          V=$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | cut -d '"' -f2)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Building $V from ${{ github.ref_name }}"

      # Signing is optional for RCs: signed when keystore secrets exist,
      # otherwise falls back to an installable debug APK.
      - name: Restore keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > release.keystore
          else
            echo "::notice::RELEASE_KEYSTORE_BASE64 not set - building debug APK"
          fi

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f release.keystore ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            ./gradlew --no-daemon assembleRelease
          else
            ./gradlew --no-daemon assembleDebug
          fi

      - name: Collect APK
        id: apk
        run: |
          src=$(ls app/build/outputs/apk/release/*.apk 2>/dev/null | head -1)
          kind=release
          if [ -z "$src" ]; then
            src=$(ls app/build/outputs/apk/debug/*.apk | head -1)
            kind=debug
          fi
          name="Messages-${{ steps.ver.outputs.version }}-$kind.apk"
          cp "$src" "$name"
          rm -f release.keystore
          echo "file=$name" >> "$GITHUB_OUTPUT"
          echo "APK: $name"

      - name: Publish RC pre-release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: RC ${{ steps.ver.outputs.version }}
          prerelease: true
          generate_release_notes: true
          files: Messages-*.apk

      - name: Check VirusTotal API key
        run: |
          if [ -z "$VT_API_KEY" ]; then
            echo "::error::Set the VIRUSTOTAL_API_KEY secret"
            exit 1
          fi

      - name: Upload to VirusTotal
        id: upload
        run: |
          APK="${{ steps.apk.outputs.file }}"
          echo "Uploading $APK ($(stat -c%s "$APK") bytes)"
          RESP=$(curl -sf -H "x-apikey: $VT_API_KEY" -F "file=@$APK" \
            https://www.virustotal.com/api/v3/files)
          ID=$(echo "$RESP" | python3 -c "import sys,json;print(json.load(sys.stdin)['data']['id'])")
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          echo "analysis_id=$ID" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "Analysis id: $ID"

      - name: Wait for analysis and extract stats
        id: result
        run: |
          ANALY="${{ steps.upload.outputs.analysis_id }}"
          mkdir -p /tmp/vt
          for i in $(seq 1 60); do
            if RESP=$(curl -sf -H "x-apikey: $VT_API_KEY" \
              "https://www.virustotal.com/api/v3/analyses/$ANALY"); then
              ST=$(echo "$RESP" | python3 -c \
                "import sys,json;print(json.load(sys.stdin)['data']['attributes']['status'])")
              if [ "$ST" = "completed" ]; then
                echo "$RESP" > /tmp/vt/result.json
                break
              fi
            fi
            sleep 15
          done
          test -f /tmp/vt/result.json || { echo "::error::Analysis did not finish in time"; exit 1; }
          python3 - "$GITHUB_OUTPUT" <<'PY'
          import json,sys
          d=json.load(open('/tmp/vt/result.json'))
          attr=d['data']['attributes']
          st=attr.get('stats',{})
          fi=d.get('meta',{}).get('file_info',{})
          total=sum(st.values())
          with open(sys.argv[1],'a') as f:
              for k in ('harmless','malicious','suspicious','undetected','timeout',
                        'confirmed-timeout','failure','type-unsupported'):
                  f.write(f"{k}={st.get(k,0)}\n")
              f.write(f"total={total}\n")
              f.write(f"sha256={fi.get('sha256','')}\n")
          print(f"engines={total} malicious={st.get('malicious',0)} suspicious={st.get('suspicious',0)}")
          PY

      - name: Post scan report to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.ver.outputs.version }}
          FILE: ${{ steps.apk.outputs.file }}
          SHA: ${{ steps.result.outputs.sha256 }}
          MAL: ${{ steps.result.outputs.malicious }}
          SUS: ${{ steps.result.outputs.suspicious }}
          GOOD: ${{ steps.result.outputs.harmless }}
          UNDET: ${{ steps.result.outputs.undetected }}
          TOTAL: ${{ steps.result.outputs.total }}
        run: |
          sleep 20
          GUILINK="https://www.virustotal.com/gui/file/$SHA"
          # releases have no comments endpoint; append the report to the
          # release notes (matches softprops-generated notes)
          REPORT=$(cat <<EOF
          ## VirusTotal Scan Report

          Results for **\`$FILE\`** - SHA-256: \`$SHA\`

          | Result | Count |
          |---|---|
          | Malicious | **$MAL** |
          | Suspicious | $SUS |
          | Harmless | $GOOD |
          | Undetected | $UNDET |
          | Total engines | $TOTAL |

          [View the full report on VirusTotal]($GUILINK)
          EOF
          )
          # The release notes can be rewritten by the release pipeline a short
          # while after publishing (eventual consistency), which would clobber
          # an append done once. Re-check and re-append for a few minutes so the
          # report is present at the end regardless of when the last write lands.
          for i in $(seq 1 12); do
            BODY=$(gh release view "$TAG" --json body --jq .body)
            if printf '%s' "$BODY" | grep -qF "## VirusTotal Scan Report"; then
              echo "VirusTotal report present (check $i)"
            else
              printf '%s\n\n%s\n' "$BODY" "$REPORT" > /tmp/vt/notes.md
              gh release edit "$TAG" --notes-file /tmp/vt/notes.md
              echo "Appended VirusTotal report (attempt $i)"
            fi
            sleep 30
          done
          {
            echo "## VirusTotal Scan Report"
            echo ""
            echo "Results for **$FILE** - [full report]($GUILINK)"
            echo ""
            echo "| Result | Count |"
            echo "|---|---|"
            echo "| Malicious | **$MAL** |"
            echo "| Suspicious | $SUS |"
            echo "| Harmless | $GOOD |"
            echo "| Undetected | $UNDET |"
            echo "| Total engines | $TOTAL |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Flag malware detections
        if: steps.result.outputs.malicious != '' && steps.result.outputs.malicious != '0'
        run: |
          echo "::error::VirusTotal reported ${{ steps.result.outputs.malicious }} malicious detection(s) for this RC APK - investigate before distributing"
          exit 1
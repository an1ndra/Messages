name: Triage

on:
  issues:
    types: [opened, reopened]
  issue_comment:
    types: [created]
  discussion:
    types: [created]
  discussion_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      kind:
        type: choice
        options: [issue, discussion]
        default: issue
      number:
        description: Issue or discussion number
        required: true

permissions:
  contents: read
  issues: write
  discussions: write

concurrency:
  group: >-
    triage-${{ inputs.kind || (github.event.discussion && 'discussion' || 'issue') }}-${{ inputs.number || github.event.issue.number || github.event.discussion.number }}-${{ github.event.discussion && (github.event.comment.parent_id || github.event.comment.id) || 'report' }}
  cancel-in-progress: false

jobs:
  triage:
    if: (github.event.sender.type != 'Bot' || github.event_name == 'issues') && !github.event.issue.pull_request
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: crmne/copilot-triage@v0
        with:
          copilot-token: ${{ github.token }}
          github-token: ${{ github.token }}
          model: ${{ vars.TRIAGE_MODEL }}
          reasoning-effort: ${{ vars.TRIAGE_REASONING_EFFORT }}
          dry-run: ${{ vars.TRIAGE_DRY_RUN }}
          kind: ${{ inputs.kind || (github.event.discussion && 'discussion' || 'issue') }}
          number: ${{ inputs.number || github.event.issue.number || github.event.discussion.number }}
        env:
          COPILOT_PROVIDER_BASE_URL: ${{ vars.OPENCODE_BASE_URL }}
          COPILOT_PROVIDER_TYPE: openai